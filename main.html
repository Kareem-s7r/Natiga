<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل درجات الطلاب</title>
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 0;
            background-color: black;
            color: #00ff00; /* لون النص أخضر ليزري */
            text-align: center;
        }
        header {
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
        header p {
            font-size: 1.2em;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        main {
            padding: 20px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: black;
            color: #00ff00;
            text-decoration: none;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00;
        }
        .button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>تعديل درجات الطلاب</h1>
        <p>التفوق يبدأ بخطوة، اجعلها خطوة نحو القمة</p>
    </header>
    <main>
        <div class="buttons">
            <a href="1.html" class="button">الثانوي العام</a>
            <a href="#" class="button disabled" id="technical">التعليم الفني</a>
            <a href="#" class="button disabled" id="azhari">الثانوي الأزهري</a>
            <a href="prep.html" class="button">الشهادة الإعدادية</a>
        </div>
    </main>
    <script>
        document.getElementById("technical").addEventListener("click", function (e) {
            e.preventDefault();
            alert("سوف يتوفر قريبًا");
        });

        document.getElementById("azhari").addEventListener("click", function (e) {
            e.preventDefault();
            alert("سوف يتوفر قريبًا");
        });
    </script>
</body>
</html>
