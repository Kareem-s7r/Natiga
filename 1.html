<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المرحلة الثانوية</title>
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 0;
            background-color: black;
            color: #00ff00; /* لون النص أخضر ليزري */
            text-align: center;
        }
        header {
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
        header p {
            font-size: 1.2em;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        main {
            padding: 20px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: black;
            color: #00ff00;
            text-decoration: none;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00;
        }
        .button.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>المرحلة الثانوية</h1>
        <p>رحلة التفوق تبدأ من هنا، اختر صفك الدراسي</p>
    </header>
    <main>
        <div class="buttons">
            <a href="1thanawy.html" class="button" onclick="showMessage( الصف الأول الثانوي )">الصف الأول الثانوي</a>
            <a href="2.html" class="button" onclick="showMessage( الصف الثاني الثانوي )">الصف الثاني الثانوي</a>
            <a href="#" class="button disabled" onclick="comingSoon()">الصف الثالث الثانوي</a>
        </div>
    </main>
    <script>
        // عرض رسالة عند الضغط على زر
        function showMessage(message) {
            alert(message + " - مرحبًا بك في هذا الصف الدراسي!");
        }

        // عرض رسالة "سيتوفر قريبًا" عند الضغط على الزر المعطل
        function comingSoon() {
            alert("الصف الثالث الثانوي - سيتوفر قريبًا!");
        }
    </script>
</body>
</html>
